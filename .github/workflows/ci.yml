name: CI - validate pull requests and pushes
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          for f in server/linux/*.sh server/backup/*.sh tools/*.sh install.sh; do
            [ -f "$f" ] && bash -n "$f"
          done
      - name: Python dependencies
        run: python3 -m pip install boto3==1.40.74 requests==2.32.5
      - name: Python syntax and unit tests
        run: |
          python3 -m compileall -q server/linux/invites server/linux/r2-transfer
          python3 -m unittest discover -s tests/r2-transfer -p 'test_*.py' -v
          python3 -m unittest discover -s tests/web -p 'test_*.py' -v
      - name: Validate Compose configuration
        run: |
          docker compose --env-file server/linux/.env.ci -f server/linux/docker-compose.yml config -q
  windows:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore SwVault.slnx
      - name: Unit and integration tests
        run: dotnet test SwVault.slnx -c Release --no-restore
      - name: Build (including SOLIDWORKS add-in)
        run: dotnet build SwVault.slnx -c Release --no-restore
