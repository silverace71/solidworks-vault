# Storage-only migration overlay: USE WITH docker-compose.tailscale-legacy.yml.
# Keeps ROOT_URL, Tailscale hostname, Git database, locks and users unchanged.
services:
  gitea:
    environment:
      GITEA__lfs__STORAGE_TYPE: minio
      GITEA__lfs__SERVE_DIRECT: "true"
      GITEA__lfs__MINIO_ENDPOINT: ${R2_ACCOUNT_ID:?Provide R2_ACCOUNT_ID}.r2.cloudflarestorage.com
      GITEA__lfs__MINIO_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?Provide R2_ACCESS_KEY_ID}
      GITEA__lfs__MINIO_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?Provide R2_SECRET_ACCESS_KEY}
      GITEA__lfs__MINIO_BUCKET: ${R2_BUCKET:?Provide R2_BUCKET}
      GITEA__lfs__MINIO_LOCATION: auto
      GITEA__lfs__MINIO_BASE_PATH: lfs/
      GITEA__lfs__MINIO_USE_SSL: "true"
      GITEA__lfs__MINIO_CHECKSUM_ALGORITHM: md5
      GITEA__lfs__MINIO_BUCKET_LOOKUP_TYPE: path
